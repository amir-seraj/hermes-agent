<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermes deck</title><style>
:root{--bg:#0c0c0c;--ln:#2e2e2e;--fg:#ededed;--mu:#8c8c8c;--dm:#1f1f1f;--ac:#ff8a2b;--ok:#b9d76c;--er:#ff5d52}
@media(prefers-color-scheme:light){:root{--bg:#f4eddd;--ln:#d8cdb6;--fg:#29241e;--mu:#7d7465;--dm:#e6dcc8;--ac:#e0761a;--ok:#5b7d1f;--er:#c23a2b}}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:12px ui-monospace,Menlo,Consolas,monospace;padding:6px}
.c{border:1px solid var(--ln);padding:12px;position:relative}
.c:before,.c:after{content:'';position:absolute;width:7px;height:7px;border:0 solid var(--mu)}
.c:before{top:-1px;left:-1px;border-width:1px 0 0 1px}.c:after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
.h,.r,.k,.t{display:flex;justify-content:space-between;align-items:center;gap:6px}
.h{color:var(--mu);font-size:10px;letter-spacing:.1em;margin-bottom:4px}.h b{color:var(--fg);font-size:13px;letter-spacing:.04em}
canvas{display:block;margin:8px auto 0}
.p{color:var(--mu);text-align:center;margin:10px 0 2px;min-height:14px;overflow-wrap:anywhere}.p i{color:var(--ac);font-style:normal}
button{font:inherit;font-weight:700;letter-spacing:.08em;color:var(--fg);background:none;border:1px solid var(--ln);padding:8px 6px;flex:1;cursor:pointer}
button.a{background:var(--ac);border-color:var(--ac);color:var(--bg)}button.s{flex:0;padding:3px 8px;font-size:10px}
.k{margin:8px 0}.r{padding:6px 0;border-top:1px solid var(--ln);cursor:pointer}.r span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.r span:first-child:before{content:'■ ';color:var(--q)}.r span+span{color:var(--q);white-space:nowrap}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 12px}
.u{color:var(--mu);font-size:10px;margin-top:10px}.b{display:flex;gap:2px;margin-top:5px}.b i{flex:1;height:7px;background:var(--dm)}.b i.on{background:var(--ac)}
.t{margin-top:10px}.t button{border-width:0 0 2px;color:var(--mu)}.t button.on{color:var(--fg);border-color:var(--ac)}
.arm{outline:1px solid var(--ac);outline-offset:-1px}.n{color:var(--mu);font-size:10px;text-align:center;margin-top:8px;min-height:13px}
</style></head><body><main class="c">
<div class="h"><b>HERMES</b><span id="clock"></span></div>
<section id="A"><canvas id="face"></canvas><canvas id="word"></canvas><p class="p" id="p"></p>
<div class="k" id="act"></div><div id="rows"></div>
<div id="use" hidden><div class="h u"><span id="ul"></span><span id="ur"></span></div><div class="b" id="bar"></div></div></section>
<section id="C" hidden><div class="h">LAUNCH</div><div class="g" id="launch"></div>
<div class="h"><span>CRON</span><span><button class="s" id="pv">‹</button> <span id="pg"></span> <button class="s" id="nx">›</button></span></div><div id="jobs"></div>
<div class="h" style="margin-top:12px">OPS</div><div class="k"><button data-k="k:fast">FAST</button><button data-k="k:yolo" data-c="1" id="yolo">YOLO</button><button data-k="k:restart" data-c="1">RESTART</button></div></section>
<p class="n" id="note"></p>
<nav class="t"><button class="on" data-tab="A">AGENT</button><button data-tab="C">CONTROLS</button></nav>
</main><script>
(function(){
var W=window.TelegramWidget,$=function(i){return document.getElementById(i)},S={s:'i',l:[],c:'',n:0,y:0,u:null},C=null,busy=0,queued=null,armed=null,page=0,tick=0,G={},
GL='WhhhlllaOehhhhheRuhhukihKhikokihIe44444eNhpljhhhGehgnhhfYhha4444UhhhhhheTv444444DuhhhhhuLggggggvEvgguggvFvgguggg',
WORD={w:'WORKING',t:'YOUR TURN',i:'IDLE',o:'OFFLINE'},ROW={w:['working','--ac'],d:['done','--ok'],i:['idle','--mu']};
for(var i=0;i<GL.length;i+=8)G[GL[i]]=GL.substr(i+1,7);
var live=W&&!W.isPreview;
function css(v){return getComputedStyle(document.body).getPropertyValue(v).trim()||'#888'}
function el(t,c,x,p){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;p&&p.appendChild(e);return e}
function grid(cv,w,h,P,f){var r=window.devicePixelRatio||2,x=cv.getContext('2d'),by={};cv.width=w*P*r;cv.height=h*P*r;cv.style.width=w*P+'px';cv.style.height=h*P+'px';x.scale(r,r);
 for(var y=0;y<h;y++)for(var X=0;X<w;X++){var k=f(X,y)||'--dm';(by[k]=by[k]||[]).push(X,y)}
 var d=P>5?P-2:P-1;for(k in by){x.fillStyle=css(k);for(var j=0;j<by[k].length;j+=2)x.fillRect(by[k][j]*P,by[k][j+1]*P,d,d)}}
function face(){var s=S.s,o=s=='w'?[-2,-1,0,1,2,1,0,-1][tick%8]:0,blink=s!='i'&&tick%13==0;
 grid($('face'),32,15,6,function(x,y){var dx=(x-15.5)/13,dy=(y-7)/7;if(Math.abs(dx*dx*dx)+Math.abs(dy*dy*dy)>1)return;
  var ex=x-o,eye=(ex>=10&&ex<=12||ex>=19&&ex<=21);
  if(s=='i'||s=='o'||blink)return eye&&y==8?'--bg':'--mu';
  if(eye&&y>=5&&y<=8)return s=='t'?'--ac':'--bg';return '--mu'})}
function word(){var t=WORD[S.s];grid($('word'),t.length*6+1,7,Math.max(3,Math.min(5,(document.body.clientWidth-40)/(t.length*6+1)|0)),function(x,y){var c=x/6|0,g=G[t[c]];if(x==t.length*6)return y==6?'--ac':0;
 return g&&x%6<5&&(parseInt(g[y],32)>>(4-x%6))&1?'--fg':0})}
function btn(p,label,k,cls,confirm){var b=el('button',cls,label,p);b.dataset.k=k;if(confirm)b.dataset.c=1;return b}
function drawA(){word();face();var p=$('p'),a=$('act');p.textContent='';a.textContent='';
 if(S.s=='t'){el('span',0,'Approve ',p);el('i',0,S.c,p);if(S.n>1)el('span',0,' +'+(S.n-1)+' more',p);btn(a,'APPROVE','k:approve','a');btn(a,'DENY','k:deny')}
 else if(S.s=='w'){p.textContent='Hermes is working in this chat.';btn(a,'STOP','k:stop','',1)}
 else p.textContent=S.s=='o'?'No connection to Hermes.':'Nothing needs you.';
 var R=$('rows');R.textContent='';S.l.forEach(function(r){var d=el('div','r',null,R),st=ROW[r[2]]||ROW.i;d.style.setProperty('--q','var('+st[1]+')');
  d.dataset.k='r:'+r[0];d.dataset.c=1;el('span',0,r[1],d);el('span',0,st[0]+' '+r[3]+(r[2]=='d'?' ago':''),d)});
 $('use').hidden=!S.u;if(S.u){$('ul').textContent=S.u[0]+' '+S.u[1]+'%';$('ur').textContent=S.u[2]?'resets '+S.u[2]:'';
  var b=$('bar');b.textContent='';for(var i=0;i<30;i++)el('i',i<S.u[1]*.3?'on':'',null,b)}}
function drawC(){if(!C)return;var L=$('launch'),J=$('jobs'),n=Math.max(1,Math.ceil(C.j.length/4));L.textContent='';J.textContent='';
 C.l.forEach(function(x,i){btn(L,x,'l:'+i,'',1)});if(!C.l.length)el('span','n','Add launchers in ~/.hermes/xdeck.yaml',L);
 page=Math.min(page,n-1);$('pg').textContent=(page+1)+'/'+n;C.j.slice(page*4,page*4+4).forEach(function(j){var d=el('div','r',null,J);
  d.style.setProperty('--q','var('+({e:'--er',o:'--ok',p:'--mu'})[j[2]]+')');el('span',0,j[1],d);btn(d,'RUN','j:'+j[0],'s',1)});
 $('yolo').textContent=S.y?'YOLO ON':'YOLO'}
function note(t){$('note').textContent=t||''}
function ask(k){if(!live)return note(k.length>1?'Preview only — open in Telegram.':'');if(busy){if(k.length>1)queued=k;return}busy=1;
 W.request(k).then(function(a){var d={};try{d=JSON.parse(a.result)}catch(e){}if(k=='a'){S=d.s?d:S;drawA()}else if(k=='c'){C=d.j?d:C;drawC()}else{note(d.t);setTimeout(function(){ask('a');$('C').hidden||ask('c')},600)}},
  function(e){var c=(e&&e.code)||'FAILED';if(k.length>1)note(c);else if(c=='TIMEOUT'||c=='FAILED'){S.s='o';drawA()}}).then(function(){busy=0;var q=queued;queued=null;q&&ask(q)})}
function disarm(){if(armed){armed.classList.remove('arm');armed=null;note()}}
document.addEventListener('click',function(e){var b=e.target.closest('[data-k],[data-tab]');if(!b)return;
 if(b.dataset.tab){disarm();document.querySelectorAll('[data-tab]').forEach(function(t){t.className=t==b?'on':''});$('A').hidden=b.dataset.tab!='A';$('C').hidden=b.dataset.tab!='C';b.dataset.tab=='C'&&ask('c');return}
 if(b.dataset.c&&armed!=b){disarm();armed=b;b.classList.add('arm');note('Tap again to confirm');setTimeout(function(){armed==b&&disarm()},3000);return}
 disarm();W&&W.HapticFeedback&&W.HapticFeedback.impactOccurred('light');ask(b.dataset.k)});
$('pv').onclick=function(e){e.stopPropagation();page=Math.max(0,page-1);drawC()};$('nx').onclick=function(e){e.stopPropagation();page++;drawC()};
function clock(){var d=new Date();$('clock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+'  '+d.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'}).toUpperCase()}
clock();drawA();drawC();ask('a');
setInterval(clock,20000);setInterval(function(){tick++;if(S.s=='w'||tick%13<2)face()},450);
setInterval(function(){if(!W||W.isActive)ask('a')},6000);
W&&W.onEvent&&(W.onEvent('activated',function(){ask('a')}),W.onEvent('themeChanged',function(){drawA()}));
W&&W.ready&&W.ready()})();
</script></body></html>
