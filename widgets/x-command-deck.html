<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X — Command deck</title><style>
*{box-sizing:border-box}body{margin:0;padding:0;background:#08080c;color:#f6f4fb;font:14px system-ui,sans-serif}.deck{max-width:940px;margin:auto;padding:16px 16px max(20px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at 56% 0%,#342050,transparent 65%),#08080c}.top,.headline,.bottomhead,.pager{display:flex;align-items:center;justify-content:space-between;gap:8px}.top{margin-bottom:14px}.brand{font-weight:800;letter-spacing:.1em}.brand b{display:inline-block;text-align:center;line-height:30px;width:32px;height:32px;border:1px solid #88869b;border-radius:50%;margin-right:7px}.tag,.pill{font:10px monospace;letter-spacing:.08em;color:#beb4ce}.headline{margin-bottom:12px}.headline h1{font-size:24px;font-weight:500;letter-spacing:-.04em;margin:0}.headline p{color:#b1a9be;margin:3px 0 0;font-size:11px}.pill{border:1px solid #56515e;border-radius:20px;padding:7px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.card{height:126px;border:1px solid #777183;border-radius:18px;padding:12px;position:relative;overflow:hidden;text-align:left;color:white;font:inherit;cursor:pointer}.card:active,.actions button:active,.pager button:active{transform:scale(.98)}.blue{background:linear-gradient(155deg,#238cde,#07104a)}.black{background:linear-gradient(155deg,#494650,#111016)}.pink{background:linear-gradient(155deg,#a93081,#210d2b)}.label{font-size:11px;font-weight:700}.arrow{position:absolute;right:9px;top:9px;text-align:center;line-height:25px;width:25px;height:25px;border-radius:50%;background:white;color:#111;font-size:15px}.number{font:19px monospace;letter-spacing:-.05em;margin-top:32px}.small{font-size:10px;color:#e2dcef;margin-top:5px}.bottom{margin-top:9px;padding:12px;background:#17151e;border:1px solid #49434f;border-radius:17px}.bottomhead{color:#aaa4b5;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.result{margin-top:8px;min-height:64px;overflow-wrap:anywhere;line-height:1.3}.result-title{font-size:12px;font-weight:700;margin-bottom:5px}.row{font-size:12px;padding:3px 6px;margin-top:3px;border-left:3px solid #aaa4b5;background:#24212a}.status .row{border-color:#70bbff;background:#14283b}.activity .row{border-color:#c5bdd5;background:#292633}.cron .row{border-color:#ff8cca;background:#361a30}.next .row{border-color:#9adbaa;background:#192c24}.bugs .row{border-color:#ffb97a;background:#34251c}.help .row{border-color:#d6beff;background:#29223a}.projects .row{border-color:#85e3da;background:#173034}.pager{margin-top:7px;font:10px monospace;color:#bbb3c5}.pager button{border:1px solid #686171;border-radius:12px;background:#302c38;color:white;padding:5px 10px;font:11px system-ui}.pager[hidden]{display:none}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.actions button{min-height:34px;border:1px solid #55505c;background:#24222a;color:#eee8f3;padding:0 10px;border-radius:18px;font:11px system-ui;cursor:pointer}.actions .feature{background:#d5f5ee;color:#102d29;border-color:#d5f5ee;font-weight:700}.note{color:#aaa1b6;font-size:10px;margin:9px 2px 0}button:disabled{opacity:.6}@media(max-width:560px){.deck{padding:12px 12px max(18px,env(safe-area-inset-bottom))}.top{margin-bottom:10px}.headline h1{font-size:21px}.card{height:112px;padding:9px}.label{font-size:10px}.number{font-size:16px;margin-top:29px}.small{font-size:9px}.arrow{right:7px;top:7px;width:22px;height:22px;line-height:22px}.bottom{padding:10px}.row{font-size:11px}}
</style></head><body><main class="deck"><header class="top"><div class="brand"><b>X</b> COMMAND DECK</div><div class="tag">PRIVATE / LIVE</div></header><div class="headline"><div><h1>Your world, in view.</h1><p>A private control surface for your day.</p></div><span class="pill">READ ONLY</span></div><section class="cards" aria-label="Dashboard"><button class="card blue" data-q="x:status"><span class="label">System status</span><span class="arrow">↗</span><div class="number">SYSTEM</div><div class="small">Gateway · load · storage</div></button><button class="card black" data-q="x:activity"><span class="label">Today's activity</span><span class="arrow">↗</span><div class="number">TODAY</div><div class="small">Sessions and messages</div></button><button class="card pink" data-q="x:cron"><span class="label">Scheduled jobs</span><span class="arrow">↗</span><div class="number">CRON</div><div class="small">Enabled · paused · total</div></button></section><section class="bottom"><div class="bottomhead"><span>Live readout</span><span>Private / read-only</span></div><div class="result" role="status" aria-live="polite" id="result">Select a card to view its details.</div><div class="pager" id="pager" hidden><button id="prev">← Previous</button><span id="page"></span><button id="next">Next →</button></div></section><nav class="actions" aria-label="More actions"><button class="feature" data-q="x:projects">✦ Projects ↗</button><button data-q="x:next">Project next ↗</button><button data-q="x:bugs">Open bugs ↗</button><button data-q="x:help">About ↗</button></nav><p class="note">Private chat only · read-only information</p></main><script>
(function(){var w=window.TelegramWidget,buttons=document.querySelectorAll('button[data-q]'),out=document.getElementById('result'),pager=document.getElementById('pager'),prev=document.getElementById('prev'),next=document.getElementById('next'),pageLabel=document.getElementById('page'),busy=false,lines=[],page=0,kind='',titles={status:'◉ SYSTEM STATUS',activity:'◷ TODAY’S ACTIVITY',cron:'◴ SCHEDULED JOBS',next:'→ PROJECT NEXT',bugs:'◇ OPEN BUGS',help:'? ABOUT THIS DECK',projects:'✦ PROJECTS'};function set(){for(var i=0;i<buttons.length;i++)buttons[i].disabled=busy}function render(){out.textContent='';out.className='result '+kind;var h=document.createElement('div');h.className='result-title';h.textContent=titles[kind]||'LIVE READOUT';out.appendChild(h);for(var i=page*2;i<lines.length&&i<page*2+2;i++){var row=document.createElement('div');row.className='row';row.textContent=lines[i]||' ';out.appendChild(row)}var pages=Math.ceil(lines.length/2);pager.hidden=pages<=1;pageLabel.textContent=(page+1)+' / '+pages;prev.disabled=page===0;next.disabled=page>=pages-1}function show(text){lines=[];var parts=text.replace(/\r\n/g,'\n').split('\n');for(var i=0;i<parts.length;i++){var s=parts[i];if(!s.length)lines.push('');while(s.length){lines.push(s.slice(0,36));s=s.slice(36)}}if(!lines.length)lines=['No response.'];page=0;render()}prev.addEventListener('click',function(){if(page>0){page--;render()}});next.addEventListener('click',function(){if((page+1)*2<lines.length){page++;render()}});for(var i=0;i<buttons.length;i++)buttons[i].addEventListener('click',function(){if(busy)return;var q=this.getAttribute('data-q');kind=q.slice(2);if(!w||w.isPreview){show('Design preview only. Live data is available inside the Telegram widget.');return}busy=true;set();show('Checking…');try{w.request(q).then(function(a){show(a&&typeof a.result==='string'&&a.result?a.result:'No response.');busy=false;set()},function(){show('Request unavailable. Please try again.');busy=false;set()})}catch(e){show('Request unavailable. Please try again.');busy=false;set()}})})();
</script></body></html>
